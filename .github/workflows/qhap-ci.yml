name: QHAP CI
on:
  push:
    paths: ["hardware/**","tests/**","rtl/**","rtl_tb/**","fpga/**",".github/workflows/qhap-ci.yml"]
  pull_request:
    paths: ["hardware/**","tests/**","rtl/**","fpga/**"]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Golden binary-frame tests
        run: python tests/generate_qhap_vectors.py
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: RTL lint
        run: verilator --lint-only --assert -Wall -Wno-fatal -sv rtl/qart_reset_sync.sv rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl/qart_frame_guard.sv rtl/qart_axis_frame_rx.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl/qart_qhap_ingress_top.sv rtl/qart_safety_assertions.sv fpga/rtl/qart_qhap_word_bridge.sv fpga/rtl/qart_qhap_fpga_top.sv fpga/rtl/qart_qhap_host_fpga_top.sv
      - name: Install Yosys
        run: sudo apt-get install -y yosys
      - name: Generic synthesis gate
        run: yosys -p "read_verilog -sv rtl/qart_reset_sync.sv rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl/qart_frame_guard.sv rtl/qart_axis_frame_rx.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl/qart_qhap_ingress_top.sv fpga/rtl/qart_qhap_word_bridge.sv fpga/rtl/qart_qhap_host_fpga_top.sv; hierarchy -check -top qart_qhap_host_fpga_top; proc; opt; check; stat"
      - name: Xilinx UltraScale+ technology-map synthesis
        run: yosys -p "read_verilog -sv rtl/qart_reset_sync.sv rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl/qart_frame_guard.sv rtl/qart_axis_frame_rx.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl/qart_qhap_ingress_top.sv fpga/rtl/qart_qhap_word_bridge.sv fpga/rtl/qart_qhap_host_fpga_top.sv; synth_xilinx -family xcup -top qart_qhap_host_fpga_top; stat"
      - name: Vendor flow contract check
        run: |
          test -s fpga/vivado/build.tcl
          test -s fpga/constraints/qart_qhap_timing.xdc
          test -s fpga/constraints/zcu111_board.xdc
          test -s fpga/rtl/qart_zcu111_top.sv
          grep -q "QART_PART" fpga/vivado/build.tcl
          grep -q "out_of_context" fpga/vivado/build.tcl
          python -c 'import json; p=json.load(open("fpga/targets/zcu111.json")); assert p["device_part"]=="xczu28dr-ffvg1517-2-e"; assert p["qhap_reference_clock_mhz"]==100; assert p["board_clock_p_pin"]=="AM15"; assert p["board_clock_n_pin"]=="AN15"; print("ZCU111 target manifest contract PASS")'
          grep -q "report_timing_summary" fpga/vivado/build.tcl
          grep -q "WNS" fpga/vivado/build.tcl
          grep -q "create_clock" fpga/constraints/qart_qhap_timing.xdc
          grep -q "AM15" fpga/constraints/zcu111_board.xdc
          grep -q "AN15" fpga/constraints/zcu111_board.xdc
          grep -q "IBUFDS" fpga/rtl/qart_zcu111_top.sv
          grep -q "xilinx.com:interface:axis:1.0 S_AXIS TDATA" fpga/rtl/qart_zcu111_top.sv
          grep -q "S_AXIS TKEEP" fpga/rtl/qart_zcu111_top.sv
          grep -q "S_AXIS TLAST" fpga/rtl/qart_zcu111_top.sv
          grep -q "AXI DMA" fpga/TRANSPORT.md
          grep -q "QART_TOP" fpga/vivado/build_zcu111.sh
      - name: Python-golden host-to-QHAP end-to-end simulation
        run: |
          PYTHONPATH=. python tests/generate_qhap_e2e.py
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_qhap_host_fpga_top rtl/qart_reset_sync.sv rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl/qart_axis_frame_rx.sv rtl/qart_frame_guard.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl/qart_qhap_ingress_top.sv fpga/rtl/qart_qhap_word_bridge.sv fpga/rtl/qart_qhap_host_fpga_top.sv rtl_tb/tb_qart_qhap_host_fpga_top.sv
          ./obj_dir/Vtb_qart_qhap_host_fpga_top
      - name: Host-to-QHAP bridge backpressure simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_qhap_word_bridge fpga/rtl/qart_qhap_word_bridge.sv rtl_tb/tb_qart_qhap_word_bridge.sv
          ./obj_dir/Vtb_qart_qhap_word_bridge
      - name: QHAP 10k protocol fault campaign
        run: PYTHONPATH=. python tests/qhap_fault_campaign.py
      - name: Generate Python-to-RTL QHAP frame
        run: PYTHONPATH=. python tests/generate_qhap_e2e.py # e2e diagnostics rerun
      - name: Python-to-RTL command-chain simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qhap_command_chain rtl/qart_axis_frame_rx.sv rtl/qart_frame_guard.sv rtl_tb/tb_qhap_command_chain.sv
          ./obj_dir/Vtb_qhap_command_chain
      - name: Autonomous QHAP ingress end-to-end simulation
        run: |
          PYTHONPATH=. python tests/generate_qhap_e2e.py
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_qhap_ingress_top rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl/qart_axis_frame_rx.sv rtl/qart_frame_guard.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl/qart_qhap_ingress_top.sv rtl_tb/tb_qart_qhap_ingress_top.sv
          ./obj_dir/Vtb_qart_qhap_ingress_top
      - name: RTL QHAP streaming CRC simulation
        run: |
          PYTHONPATH=. python tests/generate_qhap_e2e.py
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_qhap_crc_stream rtl/qart_crc32_ieee.sv rtl/qart_qhap_crc_stream.sv rtl_tb/tb_qart_qhap_crc_stream.sv
          ./obj_dir/Vtb_qart_qhap_crc_stream
      - name: Integrated fail-closed ingress simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_fail_closed_ingress rtl/qart_frame_guard.sv rtl/qart_sequence_guard.sv rtl/qart_watchdog.sv rtl/qart_fail_closed_ingress.sv rtl_tb/tb_qart_fail_closed_ingress.sv
          ./obj_dir/Vtb_qart_fail_closed_ingress
      - name: Fail-closed watchdog simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_watchdog rtl/qart_watchdog.sv rtl_tb/tb_qart_watchdog.sv
          ./obj_dir/Vtb_qart_watchdog
      - name: Stateful sequence replay-guard simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_sequence_guard rtl/qart_sequence_guard.sv rtl_tb/tb_qart_sequence_guard.sv
          ./obj_dir/Vtb_qart_sequence_guard
      - name: CRC-32 executable equivalence test
        run: |
          rm -rf obj_dir
          verilator --binary -Wall -Wno-fatal -sv --top-module tb_qart_crc32_ieee rtl/qart_crc32_ieee.sv rtl_tb/tb_qart_crc32_ieee.sv
          ./obj_dir/Vtb_qart_crc32_ieee
      - name: Frame guard executable simulation
        run: |
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_frame_guard rtl/qart_frame_guard.sv rtl_tb/tb_qart_frame_guard.sv
          ./obj_dir/Vtb_qart_frame_guard
      - name: AXI frame receiver executable simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_axis_frame_rx rtl/qart_axis_frame_rx.sv rtl_tb/tb_qart_axis_frame_rx.sv
          ./obj_dir/Vtb_qart_axis_frame_rx

