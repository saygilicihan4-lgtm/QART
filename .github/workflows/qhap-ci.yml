name: QHAP CI
on:
  push:
    paths: ["hardware/**","tests/**","rtl/**","rtl_tb/**",".github/workflows/qhap-ci.yml"]
  pull_request:
    paths: ["hardware/**","tests/**","rtl/**"]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Golden binary-frame tests
        run: python tests/generate_qhap_vectors.py
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: RTL lint
        run: verilator --lint-only --assert -Wall -Wno-fatal -sv rtl/qart_crc32_ieee.sv rtl/qart_frame_guard.sv rtl/qart_axis_frame_rx.sv rtl/qart_safety_assertions.sv
      - name: Frame guard executable simulation
        run: |
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_frame_guard rtl/qart_frame_guard.sv rtl_tb/tb_qart_frame_guard.sv
          ./obj_dir/Vtb_qart_frame_guard
      - name: AXI frame receiver executable simulation
        run: |
          rm -rf obj_dir
          verilator --binary --assert -Wall -Wno-fatal -sv --top-module tb_qart_axis_frame_rx rtl/qart_axis_frame_rx.sv rtl_tb/tb_qart_axis_frame_rx.sv
          ./obj_dir/Vtb_qart_axis_frame_rx

# CI trigger: AXI receiver timing fix verification
